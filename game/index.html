<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ivan's Game Lab 静态小游戏入口。" />
    <title>Ivan's Game Lab</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        --bg: #f4f7f5;
        --ink: #1f2a26;
        --muted: #68746f;
        --line: #d9e2dd;
        --teal: #0c8f70;
        --teal-soft: #e0f4ed;
        --amber-soft: #ffe9c2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(135deg, rgba(12, 143, 112, 0.12), rgba(232, 154, 22, 0.11) 45%, rgba(49, 111, 168, 0.10)),
          var(--bg);
      }

      main {
        width: min(980px, calc(100% - 36px));
        margin: 0 auto;
        padding: 72px 0;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--teal);
        font-size: 12px;
        font-weight: 850;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 34px;
        font-size: clamp(42px, 7vw, 74px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
      }

      a {
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 18px;
        align-items: center;
        min-height: 150px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 48px rgba(31, 42, 38, 0.08);
        transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
      }

      a:hover {
        transform: translateY(-2px);
        border-color: var(--teal);
        box-shadow: 0 24px 64px rgba(31, 42, 38, 0.12);
      }

      img {
        width: 76px;
        height: 76px;
        border-radius: 8px;
      }

      .game-icon {
        width: 76px;
        height: 76px;
        border-radius: 8px;
      }

      .tetris-icon {
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(7, 16, 10, 0.93), rgba(7, 16, 10, 0.97)),
          repeating-linear-gradient(0deg, transparent 0 15px, #344237 15px 16px),
          repeating-linear-gradient(90deg, transparent 0 15px, #344237 15px 16px);
      }

      .blocks {
        display: grid;
        grid-template-columns: repeat(3, 18px);
        grid-template-rows: repeat(2, 18px);
        filter: drop-shadow(3px 4px 0 rgba(0, 0, 0, 0.28));
      }

      .block {
        border: 2px solid #c67ce4;
        background: #9d53bd;
        box-shadow: inset 3px 3px rgba(255, 255, 255, 0.25);
      }

      .block:first-child {
        grid-column: 2;
        grid-row: 1;
      }

      .block:nth-child(2) {
        grid-column: 1;
      }

      .block:nth-child(3) {
        grid-column: 2;
      }

      .block:nth-child(4) {
        grid-column: 3;
      }

      .tag {
        display: inline-flex;
        margin-bottom: 9px;
        padding: 5px 8px;
        border-radius: 8px;
        background: var(--teal-soft);
        color: #08785e;
        font-size: 11px;
        font-weight: 850;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 25px;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      footer {
        margin-top: 28px;
        color: #88918d;
        font-size: 12px;
      }

      @media (max-width: 520px) {
        main {
          width: min(100% - 20px, 420px);
          padding: 38px 0;
        }

        a {
          grid-template-columns: 58px 1fr;
          min-height: 126px;
          padding: 16px;
        }

        img {
          width: 58px;
          height: 58px;
        }

        .game-icon {
          width: 58px;
          height: 58px;
        }

        .blocks {
          grid-template-columns: repeat(3, 14px);
          grid-template-rows: repeat(2, 14px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Ivan's Game Lab</p>
      <h1>选择一个游戏。</h1>
      <div class="grid">
        <a href="./tetris/">
          <div class="game-icon tetris-icon" aria-hidden="true">
            <div class="blocks">
              <span class="block"></span>
              <span class="block"></span>
              <span class="block"></span>
              <span class="block"></span>
            </div>
          </div>
          <div>
            <span class="tag">CLASSIC</span>
            <h2>俄罗斯方块</h2>
            <p>旋转并堆叠方块，完成整行来获得更高分数。</p>
          </div>
        </a>
        <a href="./sudoku/">
          <img src="./sudoku/sudoku-mark.svg" alt="" />
          <div>
            <span class="tag">PUZZLE</span>
            <h2>数独</h2>
            <p>难度分级、候选数编辑与高级技巧提示。</p>
          </div>
        </a>
      </div>
      <footer>ivanalgo.github.io · 2 个网页游戏</footer>
    </main>
  </body>
</html>
